<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; padding: 30px; max-width: 600px; margin: auto; color: #333;">

  <div style="text-align: center;">
    <img src="{{store_logo}}" alt="{{store_name}}" style="max-width: 200px; margin-bottom: 20px;">
  </div>

  <h2 style="text-align: center;">Your cart's still waiting</h2>

  <p>Hey {{customer_first_name}},</p>

  <p>We saved your picks — but they won't stick around forever.</p>

  <p>Our pieces go fast. Once it's gone, it's gone. Don't let your favorites get scooped by someone else.</p>

  <div style="text-align: center; margin: 40px 0;">
    <a href="{{checkout_url}}" style="background-color: #8A2BE2; color: white; padding: 14px 26px; text-decoration: none; border-radius: 6px; font-weight: 600;">Return to Your Cart</a>
  </div>

  <p>Secure your items now.</p>

  <p>– {{store_name}}</p>

</div>
